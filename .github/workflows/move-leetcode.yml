name: Move LeetCode files

on:
  push:
    branches: [ main ]
    paths:
      - '*.java'          # ← Only trigger when .java files are pushed to root

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Move java files to src/leetcode
        run: |
          mkdir -p src/leetcode
          moved=0
          for f in *.java; do
            if [ -f "$f" ]; then
              mv "$f" src/leetcode/
              moved=$((moved + 1))
            fi
          done
          echo "MOVED=$moved" >> $GITHUB_ENV

      - name: Commit changes
        if: env.MOVED != '0'        # ← Skip if nothing was moved
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "move leetcode files [skip ci]"   # ← [skip ci] breaks the loop
          git push
