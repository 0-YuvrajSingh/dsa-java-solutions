name: Move LeetCode files
on:
  push:
    branches: [ main ]
    paths:
      - '*.java'

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move java files to src/leetcode
        run: |
          mkdir -p src/leetcode
          moved=0
          for f in *.java; do
            if [ -f "$f" ]; then
              mv "$f" src/leetcode/
              moved=$((moved + 1))
            fi
          done
          echo "MOVED=$moved" >> $GITHUB_ENV

      - name: Commit changes
        if: env.MOVED != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "${{ github.event.head_commit.message }} [skip ci]"
          git push
